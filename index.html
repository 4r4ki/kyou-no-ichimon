<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きょうの一問</title>
<meta name="description" content="毎日「ふつう」と「難問」の2問、むずかしいけど面白い問題が届く学習アプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: single column card. Header (date + streak) / problem card / answer area / result + hints / footer stats. */
:root {
  color-scheme: light;
  --bg: #f4f1ea;
  --card: #fffdf8;
  --ink: #1d2433;
  --ink-soft: #5d6577;
  --line: #e2dccf;
  --accent: #c4472f;
  --accent-soft: #f7e3dc;
  --ok: #1f8a5b;
  --ok-soft: #dff2e8;
  --ng: #c4472f;
  --hint: #8a6a1c;
  --hint-soft: #f6edd2;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15171c; --card: #1e2128; --ink: #ece8df; --ink-soft: #a3a8b5; --line: #343843;
  --accent: #ef7b62; --accent-soft: #3a2621; --ok: #5ccf97; --ok-soft: #1d3329;
  --ng: #ef7b62; --hint: #e3c06a; --hint-soft: #332c1a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15171c; --card: #1e2128; --ink: #ece8df; --ink-soft: #a3a8b5; --line: #343843;
    --accent: #ef7b62; --accent-soft: #3a2621; --ok: #5ccf97; --ok-soft: #1d3329;
    --ng: #ef7b62; --hint: #e3c06a; --hint-soft: #332c1a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.75; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }

header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: .04em; flex: 1; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .78rem; color: var(--ink-soft); letter-spacing: 0; }
.streak { text-align: center; line-height: 1.1; padding: 6px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.streak b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.streak span { font-size: .7rem; color: var(--ink-soft); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; font-size: 1.05rem; }

.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.daynav button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
.daynav button:disabled { opacity: .35; cursor: default; }
.daynav .date { font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.daynav .date small { display: block; font-weight: 500; font-size: .75rem; color: var(--ink-soft); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; box-shadow: 0 1px 0 rgba(0,0,0,.03); }
.tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
.level { font-size: .78rem; color: var(--ink-soft); letter-spacing: .1em; }
h1.title { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1.4; margin: 10px 0 12px; }
.q { font-size: 1.02rem; }
.q p { margin: 0 0 .8em; }
.q .big { font-size: 1.3rem; font-weight: 700; text-align: center; letter-spacing: .08em; margin: .6em 0; font-variant-numeric: tabular-nums; }
.q ol, .q ul { padding-left: 1.4em; margin: 0 0 .8em; }
.q svg { display: block; margin: 8px auto 12px; max-width: 100%; }
.q table { border-collapse: collapse; margin: 0 auto .8em; }
.q td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; }

.answer { margin-top: 16px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; line-height: 1.5; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.wrong { border-color: var(--ng); color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--ng); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.choice:disabled { cursor: default; }
.inputrow { display: flex; gap: 8px; align-items: stretch; }
.inputrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 1.1rem; }
.inputrow .unit { align-self: center; color: var(--ink-soft); }
.primary { border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; padding: 12px 18px; white-space: nowrap; }
:root[data-theme="dark"] .primary { color: #1b1310; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #1b1310; } }
.primary:disabled { opacity: .45; cursor: default; }
.feedback { min-height: 1.6em; margin-top: 8px; font-size: .92rem; color: var(--ng); }
.feedback.ok { color: var(--ok); font-weight: 700; }
.input-help { font-size: .8rem; color: var(--ink-soft); margin-top: 6px; }

.tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .88rem; color: var(--ink-soft); }
.ghost:disabled { opacity: .4; cursor: default; }

.hints { margin-top: 12px; display: grid; gap: 8px; }
.hintbox { background: var(--hint-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: .92rem; }
.hintbox b { color: var(--hint); margin-right: 6px; }

.result { margin-top: 16px; border-radius: 18px; padding: 18px; border: 1px solid var(--line); background: var(--card); }
.result.ok { border-color: var(--ok); }
.result h2 { font-family: var(--font-display); margin: 0 0 6px; font-size: 1.25rem; }
.result .ans { font-size: 1.05rem; margin-bottom: 10px; }
.result .explain { font-size: .95rem; }
.result .explain p { margin: 0 0 .7em; }
.result .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--ink-soft); }
.history { display: flex; gap: 4px; justify-content: center; margin-top: 12px; }
.dot { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .65rem; color: var(--ink-soft); background: var(--card); }
.dot.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.dot.give { background: var(--line); }
.dot.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.next { text-align: center; margin-top: 14px; font-size: .85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
footer { text-align: center; font-size: .75rem; color: var(--ink-soft); margin-top: 24px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .88rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.result:not([hidden]) { animation: pop .25s ease-out; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .25s; }
@media (prefers-reduced-motion: reduce) { .result:not([hidden]), .shake { animation: none; } }
/* 2問（ふつう・難問）の切りかえタブ */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.tab { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 10px; text-align: left; line-height: 1.3; }
.tab b { display: block; font-size: .95rem; }
.tab small { font-size: .72rem; color: var(--ink-soft); letter-spacing: .08em; }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tab .mark { float: right; font-size: .8rem; font-weight: 700; color: var(--ok); }
.tab .mark.give { color: var(--ink-soft); }

/* 筆算（1文字ずつ同じ幅のマス） */
.calc { display: grid; grid-template-columns: repeat(var(--w), 1.35em); justify-content: center; font-size: 1.45rem; font-weight: 700; line-height: 1.6; margin: .4em 0 .9em; font-variant-numeric: tabular-nums; }
.calc span { text-align: center; }
.calc .sum { border-top: 2px solid currentColor; }
/* 魔方陣などのマス */
table.grid { border-collapse: collapse; margin: 4px auto 12px; }
table.grid td { width: 2.6em; height: 2.6em; border: 1px solid var(--ink-soft); text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; padding: 0; }
.dot.hard { position: relative; }
.dot.hard::after { content: "★"; position: absolute; top: -9px; right: -5px; font-size: .7rem; color: var(--hint); }
.nudge { margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">きょうの一問<small>1日2問、むずかしいけど面白い。</small></div>
    <div class="streak" title="連続正解日数"><b id="streak">0</b><span>連続日数</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="表示テーマを切りかえる">◐</button>
  </header>

  <nav class="daynav" aria-label="日付">
    <button id="prevBtn" aria-label="前の日の問題">← 前日</button>
    <div class="date" id="dateLabel"></div>
    <button id="nextBtn" aria-label="次の日の問題">翌日 →</button>
  </nav>

  <div class="tabs" role="tablist" aria-label="問題の種類">
    <button class="tab" role="tab" id="tab-normal" data-slot="normal"><span class="mark"></span><b>ふつう</b><small></small></button>
    <button class="tab" role="tab" id="tab-hard" data-slot="hard"><span class="mark"></span><b>難問</b><small></small></button>
  </div>

  <main class="card" id="card" role="tabpanel">
    <div><span class="tag" id="genre"></span><span class="level" id="level"></span></div>
    <h1 class="title" id="title"></h1>
    <div class="q" id="question"></div>

    <div class="answer" id="answerArea"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <div class="tools" id="tools">
      <button class="ghost" id="hintBtn">ヒントを見る</button>
      <button class="ghost" id="giveBtn">降参して答えを見る</button>
    </div>
    <div class="hints" id="hints"></div>
  </main>

  <section class="result" id="result" hidden>
    <h2 id="resultTitle"></h2>
    <div class="ans" id="resultAns"></div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="primary" id="shareBtn">結果をシェア</button>
      <button class="ghost nudge" id="nudgeBtn" hidden></button>
    </div>
  </section>

  <section class="stats" aria-label="きろく">
    <div class="stat"><b id="statSolved">0</b><span>正解した問題</span></div>
    <div class="stat"><b id="statBest">0</b><span>最長連続日数</span></div>
    <div class="stat"><b id="statHard">0</b><span>難問クリア</span></div>
  </section>
  <div class="history" id="history" aria-label="直近7日"></div>
  <div class="next" id="nextIn"></div>

  <footer>問題数 <span id="total"></span>問。きろくはこの端末のブラウザの中にだけ保存されます。</footer>
</div>
<div class="toast" id="toast"></div>

<script src="problems.js?v=3"></script>
<script src="generated.js?v=3"></script>
<script src="core.js?v=3"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// 保存（この端末のブラウザだけ）
//   db.days['YYYY-MM-DD'] = ふつうの問題の記録、db.days['YYYY-MM-DD#hard'] = 難問の記録
// ---------------------------------------------------------------------------
const STORE = 'kyou-no-ichimon-v1';
let db = {};
try { db = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { db = {}; }
db.days = db.days || {};
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { /* 保存できない環境でも遊べる */ } };
const SLOTS = ['normal', 'hard'];
const slotKey = (d, slot) => keyOf(d) + (slot === 'hard' ? '#hard' : '');
const rec = key => (db.days[key] = db.days[key] || { pid: current.id, tries: 0, hints: 0, wrong: [], done: null });

// その日に出す問題。一度さわった日は記録した問題を出す（問題を追加しても入れかわらないように）
function pickFor(d, slot) {
  const r = db.days[slotKey(d, slot)];
  if (r && r.pid) { const p = problemById(r.pid, d); if (p) return p; }
  if (r && !r.pid && slot === 'normal') { const p = legacyFor(d); r.pid = p.id; save(); return p; }
  return slot === 'hard' ? hardFor(d) : normalFor(d);
}

// ---------------------------------------------------------------------------
// 画面
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
let viewDate = today();
let slot = 'normal';
let current = null;
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

function render() {
  const d = viewDate, t = today(), key = slotKey(d, slot);
  current = pickFor(d, slot);
  const r = db.days[key];
  const n = dayNum(d) + 1;
  $('dateLabel').innerHTML = `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）<small>${n >= 1 ? `第${n}回` : 'プレ公開の問題'}${keyOf(d) === keyOf(t) ? '・きょう' : ''}</small>`;
  $('prevBtn').disabled = dayNum(d) <= dayNum(t) - 6;
  $('nextBtn').disabled = keyOf(d) === keyOf(t);

  for (const s of SLOTS) {
    const tab = $('tab-' + s), p = pickFor(d, s), x = db.days[slotKey(d, s)];
    tab.setAttribute('aria-selected', String(s === slot));
    tab.querySelector('small').textContent = stars(p.level);
    const mark = tab.querySelector('.mark');
    mark.textContent = x && x.done === 'ok' ? '✓ 正解' : x && x.done === 'give' ? '降参' : '';
    mark.className = 'mark' + (x && x.done === 'give' ? ' give' : '');
  }

  $('genre').textContent = GENRES[current.genre];
  $('level').textContent = 'むずかしさ ' + stars(current.level);
  $('title').textContent = current.title;
  $('question').innerHTML = current.q;
  $('feedback').textContent = ''; $('feedback').className = 'feedback';

  renderAnswer(r);
  renderHints(r);
  renderResult(r);
  renderStats();
}

function renderAnswer(r) {
  const area = $('answerArea'); area.innerHTML = '';
  const done = r && r.done;
  if (current.type === 'choice') {
    const box = document.createElement('div'); box.className = 'choices';
    current.choices.forEach((c, i) => {
      const b = document.createElement('button'); b.className = 'choice'; b.textContent = c;
      if (r && r.wrong.includes(String(i))) { b.classList.add('wrong'); b.disabled = true; }
      if (done && i === current.answer) b.classList.add('right');
      if (done) b.disabled = true;
      b.addEventListener('click', () => submit(String(i), b));
      box.appendChild(b);
    });
    area.appendChild(box);
  } else {
    const isExpr = current.type === 'expr';
    const numeric = !isExpr && !current.set && current.answer.every(a => /^-?[\d.]+$/.test(a));
    const row = document.createElement('form'); row.className = 'inputrow';
    row.innerHTML = `<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="答え" ${numeric ? 'inputmode="decimal"' : ''} placeholder="${isExpr ? '式を入力' : '答えを入力'}">` +
      (current.unit ? `<span class="unit">${current.unit}</span>` : '') + '<button class="primary" type="submit">答える</button>';
    row.addEventListener('submit', e => { e.preventDefault(); const v = $('ans').value; if (v.trim()) submit(v, row); });
    area.appendChild(row);
    if (current.help) { const h = document.createElement('div'); h.className = 'input-help'; h.textContent = current.help; area.appendChild(h); }
    if (done) { row.querySelectorAll('input,button').forEach(el => (el.disabled = true)); if (r.done === 'ok' && r.last) $('ans').value = r.last; }
  }
  $('tools').hidden = !!done;
}

function renderHints(r) {
  const box = $('hints'); box.innerHTML = '';
  const shown = r ? r.hints : 0;
  current.hints.slice(0, shown).forEach((h, i) => {
    const el = document.createElement('div'); el.className = 'hintbox';
    el.innerHTML = `<b>ヒント${i + 1}</b>${h}`; box.appendChild(el);
  });
  $('hintBtn').disabled = shown >= current.hints.length;
  $('hintBtn').textContent = shown >= current.hints.length ? 'ヒントはここまで' : `ヒントを見る（${shown}/${current.hints.length}）`;
}

function renderResult(r) {
  const box = $('result');
  if (!r || !r.done) { box.hidden = true; return; }
  box.hidden = false;
  box.className = 'result' + (r.done === 'ok' ? ' ok' : '');
  $('resultTitle').textContent = r.done === 'ok'
    ? (r.tries === 1 && r.hints === 0 ? '一発正解！ おみごと。' : `正解！（${r.tries}回目${r.hints ? `・ヒント${r.hints}つ` : ''}）`)
    : '答えはこちら';
  const at = answerText(current);
  $('resultAns').innerHTML = at ? `答え：<b>${at}</b>` : '';
  $('explain').innerHTML = current.explain;
  // もう1問のほうに案内
  const other = slot === 'normal' ? 'hard' : 'normal', o = db.days[slotKey(viewDate, other)];
  const nb = $('nudgeBtn');
  nb.hidden = !!(o && o.done);
  nb.textContent = other === 'hard' ? '難問にも挑戦する →' : 'ふつうの問題へ →';
}

function okDates() {
  return new Set(Object.entries(db.days).filter(([, x]) => x.done === 'ok' && x.onTime).map(([k]) => k.slice(0, 10)));
}
function streakInfo() {
  const ok = okDates(), t = today();
  let cur = 0, d = ok.has(keyOf(t)) ? t : addDays(t, -1);
  while (ok.has(keyOf(d))) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const k of [...ok].sort()) {
    const [y, m, dd] = k.split('-').map(Number);
    run = prev && keyOf(addDays(new Date(y, m - 1, dd), -1)) === prev ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  }
  return { cur, best: Math.max(best, cur) };
}

function renderStats() {
  const ents = Object.entries(db.days);
  const s = streakInfo();
  $('streak').textContent = s.cur;
  $('statSolved').textContent = ents.filter(([, v]) => v.done === 'ok').length;
  $('statBest').textContent = s.best;
  $('statHard').textContent = ents.filter(([k, v]) => k.endsWith('#hard') && v.done === 'ok').length;
  const h = $('history'); h.innerHTML = '';
  const t = today();
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i), a = db.days[slotKey(d, 'normal')], b = db.days[slotKey(d, 'hard')];
    const okA = a && a.done === 'ok', okB = b && b.done === 'ok';
    const el = document.createElement('button');
    el.className = 'dot' + (okA || okB ? ' ok' : (a && a.done) || (b && b.done) ? ' give' : '') + (okB ? ' hard' : '') + (keyOf(d) === keyOf(viewDate) ? ' today' : '');
    el.textContent = d.getDate();
    el.setAttribute('aria-label', `${d.getMonth() + 1}月${d.getDate()}日の問題${okA ? '（ふつう正解）' : ''}${okB ? '（難問正解）' : ''}`);
    el.addEventListener('click', () => { viewDate = d; render(); });
    h.appendChild(el);
  }
}

function submit(value, el) {
  const key = slotKey(viewDate, slot), r = rec(key);
  if (r.done) return;
  const res = checkAnswer(current, value);
  if (res.invalid) { $('feedback').className = 'feedback'; $('feedback').textContent = res.msg; shake(el); return; } // 書き方のまちがいは回数に数えない
  r.tries++;
  if (res.ok) {
    r.done = 'ok'; r.last = value; r.onTime = keyOf(viewDate) === keyOf(today());
    save(); render();
    $('feedback').className = 'feedback ok';
    $('feedback').textContent = res.msg || '正解！';
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else {
    if (current.type === 'choice') r.wrong.push(value);
    save();
    if (current.type === 'choice') { el.classList.add('wrong'); el.disabled = true; }
    $('feedback').className = 'feedback';
    $('feedback').textContent = ['ちがうみたい。もう一度考えてみよう。', 'おしい…かも？ 別の見方をしてみよう。', 'まだまだ！ ヒントを使ってもOK。'][Math.min(r.tries - 1, 2)];
    shake(el);
  }
}

function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

for (const s of SLOTS) $('tab-' + s).addEventListener('click', () => { slot = s; render(); });
$('nudgeBtn').addEventListener('click', () => { slot = slot === 'normal' ? 'hard' : 'normal'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('hintBtn').addEventListener('click', () => {
  const r = rec(slotKey(viewDate, slot));
  if (r.hints < current.hints.length) { r.hints++; save(); renderHints(r); }
});
$('giveBtn').addEventListener('click', () => {
  if (!confirm('降参して答えを見ますか？')) return;
  const r = rec(slotKey(viewDate, slot)); r.done = 'give'; save(); render();
  $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
$('prevBtn').addEventListener('click', () => { viewDate = addDays(viewDate, -1); render(); });
$('nextBtn').addEventListener('click', () => { viewDate = addDays(viewDate, 1); render(); });

$('shareBtn').addEventListener('click', async () => {
  const d = viewDate, r = db.days[slotKey(d, slot)];
  const head = `きょうの一問 ${d.getMonth() + 1}/${d.getDate()}${slot === 'hard' ? '【難問】' : ''}「${current.title}」`;
  const body = r.done === 'ok'
    ? `${'🟥'.repeat(Math.min(r.tries - 1, 10))}🟩 ${r.tries}回目で正解${r.hints ? `（ヒント${'💡'.repeat(r.hints)}）` : '（ヒントなし）'}`
    : '🏳️ 降参…あしたこそ';
  const text = `${head}\n${body}\n連続 ${streakInfo().cur}日`;
  try {
    if (navigator.share) { await navigator.share({ text, url: location.href.split('#')[0] }); return; }
    await navigator.clipboard.writeText(text + '\n' + location.href.split('#')[0]);
    toast('結果をコピーしました');
  } catch (e) { if (e && e.name !== 'AbortError') toast('シェアできませんでした'); }
});

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

// テーマ切りかえ（自動 → ライト → ダーク）
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(th) { if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th; }
let theme = 'auto'; try { theme = localStorage.getItem(STORE + '-theme') || 'auto'; } catch (e) {}
applyTheme(theme);
$('themeBtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme);
  try { localStorage.setItem(STORE + '-theme', theme); } catch (e) {}
  toast({ auto: 'テーマ：端末に合わせる', light: 'テーマ：ライト', dark: 'テーマ：ダーク' }[theme]);
});

// 次の問題までのカウントダウン（日付が変わったら、きょうの問題を見ていた人は新しい問題へ）
let shownToday = keyOf(today());
function tick() {
  const t = today();
  if (keyOf(t) !== shownToday) {
    if (keyOf(viewDate) === shownToday) viewDate = t;
    shownToday = keyOf(t); render();
  }
  const s = Math.max(0, Math.floor((addDays(t, 1) - new Date()) / 1000));
  $('nextIn').textContent = `次の問題まで ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
setInterval(tick, 1000);

$('total').textContent = ALL_PROBLEMS.length.toLocaleString();
render(); tick();
</script>
</body>
</html>
